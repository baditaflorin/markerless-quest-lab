services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/baditaflorin/markerless-quest-lab-api:latest
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      LOG_LEVEL: info
      PUBLIC_BASE_URL: http://localhost:25342
    expose:
      - "8080"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: ghcr.io/baditaflorin/markerless-quest-lab-web:latest
    depends_on:
      - api
    ports:
      - "25342:25342"

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles:
      - observability
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

volumes:
  prometheus-data:
